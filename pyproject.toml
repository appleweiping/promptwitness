[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promptwitness"
version = "0.2.0"
description = "Structural diffs and compatibility checks for chat prompt specifications"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wei Ping" }]
keywords = ["llm", "prompt", "diff", "testing", "tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.11", "pytest>=8.2", "pytest-cov>=5", "ruff>=0.6", "twine>=5"]

[project.scripts]
promptwitness = "promptwitness.cli:main"

[project.urls]
Changelog = "https://github.com/appleweiping/promptwitness/blob/main/CHANGELOG.md"
Discussions = "https://github.com/appleweiping/promptwitness/discussions"
Documentation = "https://github.com/appleweiping/promptwitness#readme"
Issues = "https://github.com/appleweiping/promptwitness/issues"
Source = "https://github.com/appleweiping/promptwitness"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptwitness = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=promptwitness --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["promptwitness"]
mypy_path = "src"
